# PrintFlow — two services, nothing to edit.
#
#   docker compose up -d
#
# Then open https://<this-host>:8443 and work through the setup wizard. The
# certificate is self-signed and generated on first boot, so your browser will
# warn once; the wizard lets you re-issue it for your real hostname and download
# it for your trust store.
#
# Everything else — the admin login, Etsy, QuickBooks, Bambuddy and ShipStation
# credentials, poll intervals — is configured in the app. There are no config
# files and no secrets to invent.
#
# The `printflow-data` volume holds the generated encryption key that stored
# credentials are encrypted with. Back it up, and do not delete it unless you
# intend to reconnect every integration.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: printflow
      POSTGRES_PASSWORD: printflow
      POSTGRES_DB: printflow
    volumes:
      - printflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printflow -d printflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://printflow:printflow@postgres:5432/printflow
      # SECRET_KEY is optional. Left unset, PrintFlow generates one on first
      # boot and keeps it in the data volume. Set it here only if you would
      # rather manage the key yourself — changing it later makes already-stored
      # credentials undecryptable.
      # SECRET_KEY: ""
    volumes:
      - printflow-data:/data
    ports:
      - "8443:8443" # HTTPS — use this one
      - "8420:8000" # HTTP — fallback, and handy if the certificate goes wrong

volumes:
  printflow-db:
  printflow-data:
